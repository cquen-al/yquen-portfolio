<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="logo">🍞BREAD</a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('products') }}">Products</a>
                <a href="{{ url_for('contact') }}">Contacts</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="contact-page">
            <div id="section-wrapper">
                <div class="box-wrapper">
                    <div class="info-wrap">
                        <h2 class="info-title">Contact Information</h2>
                        <h3 class="info-sub-title">Message us and we'll get back to you as soon as we can!</h3>
                        <ul class="info-details">
                            <li>
                                <i class="fas fa-phone-alt"></i>
                                <span>Phone:</span> <a href="09098863557">09098863557</a>
                            </li>
                            <li>
                                <i class="fas fa-paper-plane"></i>
                                <span>Email:</span> <a href="mailto:info@yoursite.com">laultina@yoursite.com</a>
                            </li>
                            <li>
                                <i class="fas fa-globe"></i>
                                <span>Website:</span> <a href="#">laultina.com</a>
                            </li>
                        </ul>
                        <ul class="social-icons">
                            <li><a href="#"><i class="fab fa-facebook"></i></a></li>
                            <li><a href="#"><i class="fab fa-twitter"></i></a></li>
                            <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                        </ul>
                    </div>
                    <div class="form-wrap">
                        <form action="{{ url_for('contact') }}" method="POST">
                            <h2 class="form-title">Send us a message</h2>
                            <div class="form-fields">
                                <div class="form-group">
                                    <input type="text" name="first_name" placeholder="First Name" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" name="last_name" placeholder="Last Name" required>
                                </div>
                                <div class="form-group">
                                    <input type="email" name="email" placeholder="Email" required>
                                </div>
                                <div class="form-group">
                                    <input type="text" name="phone" placeholder="Phone" required>
                                </div>
                                <div class="form-group">
                                    <textarea name="message" placeholder="Write your message" required></textarea>
                                </div>
                            </div>
                            <input type="submit" value="Send Message" class="submit-button">
                        </form>
                        {% if success %}
                            <p style="color:green; margin-top:10px;">{{ success }}</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </section>
    </main>

<section style="padding: 2rem; text-align: center;">
    <h2 style="margin-bottom: 1rem; font-family: 'Poppins', sans-serif;">Our Location</h2>
    <div style="width: 100%; max-width: 1000px; margin: 0 auto;">
        <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126425.53294452707!2d125.45705735647342!3d8.944114482212214!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3301c05627a079b1%3A0x859bec1241478ea7!2sAgusan%20del%20Norte%20Electric%20Cooperative%2C%20Inc.!5e0!3m2!1sen!2sph!4v1714374350326!5m2!1sen!2sph" 
        width="100%" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
      
    </div>
</section>
    
</body>
</html>

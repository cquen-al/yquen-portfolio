<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Talkine&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('home') }}" class="logo">🍞BREAD</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('products') }}">Products</a>
            <a href="{{ url_for('contact') }}">Contacts</a>
        </div>
    </div>
</nav>

<section class="content order-page">
    <div class="order-card">
        <h2>🎉 Order Placed Successfully!</h2>
        <p>Thank you, <strong>{{ customer }}</strong>!</p>
        <p><strong>Order ID:</strong> {{ order_id }}</p>

        <h3>Order Details</h3>
        <ul>
            {% for item in items %}
            <li>
                {{ item.name }} —
                Qty: {{ item.quantity }} —
                ₱{{ "%.2f"|format(item.price) }}
            </li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('home') }}"
           class="submit-button"
           style="display:inline-block;text-decoration:none;">
            Back to Home
        </a>
    </div>
</section>

</body>
</html> |
